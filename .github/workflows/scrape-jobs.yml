name: 🎮 Coletor de Vagas Games BR

on:
  schedule:
    # Executa às 11h e 22h UTC (08h e 19h BRT)
    - cron: '0 11,22 * * *'
  workflow_dispatch:  # Execução manual via GitHub UI

permissions:
  contents: write  # Necessário para commit e push automático sem configuração manual

jobs:
  fetch-jobs:
    name: Coletar e publicar vagas
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 Checkout do repositório
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Instalar dependências se necessário
        run: npm ci || npm install --production=false

      - name: 🎮 Executar coletor de vagas
        run: node scripts/fetch-jobs.mjs
        env:
          JSEARCH_API_KEY: ${{ secrets.JSEARCH_API_KEY }}

      - name: 📊 Verificar mudanças em vagas.json
        id: changes
        run: |
          if git diff --quiet public/data/vagas.json; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "ℹ️  Nenhuma vaga nova encontrada"
          else
            ADDED=$(git diff public/data/vagas.json | grep '^+' | grep -c '"vagaId"' || true)
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "count=$ADDED" >> $GITHUB_OUTPUT
            echo "✅ Vagas novas/atualizadas detectadas: $ADDED"
          fi

      - name: 💾 Commit e push das vagas atualizadas
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/vagas.json
          git commit -m "🎮 chore: atualizar vagas games BR [${{ steps.changes.outputs.count }} novas] [skip ci]"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 📋 Resumo da execução
        run: |
          TOTAL=$(node -e "const fs=require('node:fs'); try { console.log(JSON.parse(fs.readFileSync('./public/data/vagas.json')).length); } catch { console.log('?'); }" 2>/dev/null || echo "?")
          echo "## 🎮 Resultado da Coleta" >> $GITHUB_STEP_SUMMARY
          echo "- **Total de vagas no JSON:** $TOTAL" >> $GITHUB_STEP_SUMMARY
          echo "- **Mudanças detectadas:** ${{ steps.changes.outputs.changed }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Data/hora:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
